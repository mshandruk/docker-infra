networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:

services:
  prometheus:
    image: prom/prometheus:v${PROMETHEUS_VERSION:-latest}
    container_name: prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${PROMETHEUS_CPU_LIMIT:-0.50}
          memory: ${PROMETHEUS_MEMORY_LIMIT:-1G}
        reservations:
          memory: ${PROMETHEUS_MEMORY_RESERVE:-512M}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./prometheus:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - 9090:9090
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    container_name: grafana
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${GRAFANA_CPU_LIMIT:-0.50}
          memory: ${GRAFANA_MEMORY_LIMIT:-1G}
        reservations:
          memory: ${GRAFANA_MEMORY_RESERVE:-512M}
    environment:
      - TZ=${TZ:-UTC}
    depends_on:
      - prometheus
    ports:
      - 3000:3000
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning:ro
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v${NODE_EXPORTER_VERSION:-latest}
    container_name: node-exporter
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${NODE_EXPORTER_CPU_LIMIT:-0.50}
          memory: ${NODE_EXPORTER_MEMORY_LIMIT:-128M}
        reservations: 
          memory: ${NODE_EXPORTER_MEMORY_RESERVE:-64M}
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker)($$|/)'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /:/host:ro,rslave
    network_mode: host
    pid: host

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v${CADVISOR_VERSION:-latest}
    container_name: cadvisor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${CADVISOR_CPU_LIMIT:-0.50}
          memory: ${CADVISOR_MEMORY_LIMIT:-512M}
        reservations:
          memory: ${CADVISOR_MEMORY_RESERVE:-256M}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - 8080:8080
    networks:
      - monitoring
